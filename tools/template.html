<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>메디내비 온라인 진료실</title>
<style>
:root{
  --bg:#eef2fb; --bg-2:#e3e9f8; --surface:rgba(255,255,255,.78); --surface-solid:#ffffff; --surface-2:rgba(236,242,252,.9); --text:#0d1733; --muted:#5b6788; --line:rgba(99,120,180,.22);
  --brand:#0891b2; --brand-2:#6366f1; --brand-3:rgba(8,145,178,.10); --brand-ink:#ffffff; --navy:#4338ca; --focus:#6366f1; --head-a:#0b1636; --head-b:#24205f;
  --glow:rgba(8,145,178,.28); --grid:rgba(67,56,202,.07); --orb-a:rgba(34,211,238,.35); --orb-b:rgba(129,140,248,.35);
  --em:#e02d48; --em-bg:rgba(224,45,72,.10); --ur:#d26a06; --ur-bg:rgba(210,106,6,.11); --soon:#4f46e5; --soon-bg:rgba(79,70,229,.10); --ok:#0f8a5f; --ok-bg:rgba(15,138,95,.10);
  --shadow:0 18px 50px rgba(30,40,90,.12); --shadow-sm:0 3px 12px rgba(30,40,90,.07); --radius:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark; --bg:#050915; --bg-2:#0a1024; --surface:rgba(17,26,52,.72); --surface-solid:#111a34; --surface-2:rgba(25,36,70,.75); --text:#e7eeff; --muted:#93a1c6; --line:rgba(120,150,230,.20);
    --brand:#22d3ee; --brand-2:#a78bfa; --brand-3:rgba(34,211,238,.12); --brand-ink:#04111c; --navy:#a5b4fc; --focus:#a78bfa; --head-a:#070d22; --head-b:#1a1648;
    --glow:rgba(34,211,238,.35); --grid:rgba(120,150,255,.06); --orb-a:rgba(34,211,238,.22); --orb-b:rgba(167,139,250,.22);
    --em:#ff5c74; --em-bg:rgba(255,92,116,.13); --ur:#ffad4d; --ur-bg:rgba(255,173,77,.12); --soon:#a5b4fc; --soon-bg:rgba(165,180,252,.12); --ok:#4ade9b; --ok-bg:rgba(74,222,155,.11);
    --shadow:0 18px 50px rgba(0,0,0,.45); --shadow-sm:0 3px 12px rgba(0,0,0,.3); }
}
:root[data-theme="dark"]{color-scheme:dark; --bg:#050915; --bg-2:#0a1024; --surface:rgba(17,26,52,.72); --surface-solid:#111a34; --surface-2:rgba(25,36,70,.75); --text:#e7eeff; --muted:#93a1c6; --line:rgba(120,150,230,.20);
    --brand:#22d3ee; --brand-2:#a78bfa; --brand-3:rgba(34,211,238,.12); --brand-ink:#04111c; --navy:#a5b4fc; --focus:#a78bfa; --head-a:#070d22; --head-b:#1a1648;
    --glow:rgba(34,211,238,.35); --grid:rgba(120,150,255,.06); --orb-a:rgba(34,211,238,.22); --orb-b:rgba(167,139,250,.22);
    --em:#ff5c74; --em-bg:rgba(255,92,116,.13); --ur:#ffad4d; --ur-bg:rgba(255,173,77,.12); --soon:#a5b4fc; --soon-bg:rgba(165,180,252,.12); --ok:#4ade9b; --ok-bg:rgba(74,222,155,.11);
    --shadow:0 18px 50px rgba(0,0,0,.45); --shadow-sm:0 3px 12px rgba(0,0,0,.3); }
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--text);background:var(--bg);font:16px/1.55 "Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head-a)}
/* living background: grid + drifting light orbs */
.bg-fx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/44px 44px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/44px 44px,
  radial-gradient(1000px 600px at 50% -20%,var(--bg-2),var(--bg) 70%)}
.bg-fx i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.9;animation:drift 22s ease-in-out infinite alternate}
.bg-fx i:nth-child(1){width:460px;height:460px;left:-120px;top:8%;background:var(--orb-a)}
.bg-fx i:nth-child(2){width:520px;height:520px;right:-160px;top:40%;background:var(--orb-b);animation-duration:28s;animation-delay:-6s}
.bg-fx i:nth-child(3){width:300px;height:300px;left:35%;bottom:-120px;background:var(--orb-a);animation-duration:25s;animation-delay:-12s;opacity:.6}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-40px) scale(1.12)}100%{transform:translate(-40px,50px) scale(.95)}}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(90deg,color-mix(in srgb,var(--head-a) 88%,transparent),color-mix(in srgb,var(--head-b) 88%,transparent));color:#fff;backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid rgba(140,170,255,.18)}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,#22d3ee,#a78bfa,transparent);background-size:200% 100%;animation:sweep 6s linear infinite}
@keyframes sweep{from{background-position:200% 0}to{background-position:-200% 0}}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;line-height:1.15}
.brand .logo{position:relative;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#22d3ee,#818cf8);display:grid;place-items:center;box-shadow:0 0 18px rgba(34,211,238,.55)}
.brand .logo::after{content:"";position:absolute;inset:-4px;border-radius:15px;border:1.5px solid rgba(34,211,238,.6);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.35);opacity:0}}
.brand b{display:block;font-size:17px;letter-spacing:-.02em}
.brand small{font-size:10.5px;opacity:.7;letter-spacing:.22em}
.uid{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.95}
.uid input{width:96px;padding:6px 9px;border:1px solid rgba(255,255,255,.18);border-radius:10px;background:rgba(255,255,255,.08);color:#fff}
.uid input::placeholder{color:rgba(255,255,255,.6)}
.hbtn{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700;transition:background .2s,box-shadow .2s}
.hbtn:hover{background:rgba(255,255,255,.16);box-shadow:0 0 14px rgba(34,211,238,.35)}
.status{font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);white-space:nowrap}
.status.on{color:#7dfbe0}
/* buttons */
.btn{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:14px;padding:11px 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s,border-color .2s,box-shadow .2s}
.btn:hover{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-3)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(120deg,var(--brand),var(--brand-2),var(--brand));background-size:200% 100%;border-color:transparent;color:#fff;box-shadow:0 8px 24px var(--glow);animation:flow 6s linear infinite}
:root[data-theme="dark"] .btn.primary{color:#04111c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#04111c}}
@keyframes flow{from{background-position:0 0}to{background-position:200% 0}}
.btn.primary:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;animation:none}
.btn.ghost{background:transparent;backdrop-filter:none;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{color:var(--brand);box-shadow:none}
.btn.ghost:disabled{opacity:.35}
.btn.danger{color:var(--em)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:11px}
.btn.wide{flex:1}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.22;pointer-events:none;animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(4);opacity:0}}
main{padding:22px 0 50px}
.card{background:var(--surface);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;position:relative}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 55%,transparent),transparent 40%,transparent 60%,color-mix(in srgb,var(--brand-2) 55%,transparent));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
/* stage tracker */
.stages{display:flex;gap:6px;margin:6px 0 12px;padding:0;list-style:none}
.stages li{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:8px 2px 0;position:relative}
.stages li::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;border-radius:4px;background:var(--line)}
.stages li.done{color:var(--brand)} .stages li.done::before{background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.stages li.cur{color:var(--text)} .stages li.cur::before{background:linear-gradient(90deg,var(--brand),var(--brand-2));box-shadow:0 0 12px var(--glow);animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
.stages li span{display:block;font-size:16px;line-height:1.1;margin-bottom:2px}
.navrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-bottom:16px;box-shadow:inset 0 0 0 1px var(--line)}
.bar>i{position:relative;display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px var(--glow);overflow:hidden}
.bar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-100%);animation:shine 2.2s ease-in-out infinite}
@keyframes shine{to{transform:translateX(100%)}}
/* AI nurse bubble */
.ask{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.doc{position:relative;flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:25px;background:radial-gradient(circle at 30% 30%,var(--surface-solid),var(--brand-3))}
.doc::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(from 0deg,var(--brand),transparent 35%,var(--brand-2) 60%,transparent 85%,var(--brand));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bubble{flex:1;background:var(--brand-3);border:1px solid color-mix(in srgb,var(--brand) 22%,transparent);border-radius:4px 18px 18px 18px;padding:12px 16px}
.bubble .who{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--brand);margin-bottom:2px;letter-spacing:.04em}
.bubble .who::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brand);box-shadow:0 0 8px var(--brand);animation:breathe 1.4s ease-in-out infinite}
.q-title{font-size:21px;line-height:1.38;margin:0;letter-spacing:-.025em}
.q-title .w{display:inline-block;opacity:0;transform:translateY(6px);filter:blur(4px);animation:wordIn .45s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes wordIn{to{opacity:1;transform:none;filter:none}}
.q-help{color:var(--muted);margin:4px 0 0;font-size:14px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.tiles{grid-template-columns:1fr 1fr}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);transition:border-color .2s,background .2s,transform .15s,box-shadow .2s;box-shadow:var(--shadow-sm)}
.opt:hover{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-3),0 8px 24px var(--glow);transform:translateY(-1px)}
.opt:active{transform:scale(.985)}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--brand);background:linear-gradient(135deg,var(--brand-3),color-mix(in srgb,var(--brand-2) 12%,transparent));box-shadow:0 0 0 1px var(--brand),0 8px 26px var(--glow)}
.opts.tiles .opt{flex-direction:column;align-items:flex-start;gap:6px;min-height:100px}
.opt .ico{font-size:26px;line-height:1;transition:transform .3s}
.opt:hover .ico{transform:scale(1.15) rotate(-6deg)}
.opt .t{font-weight:700}
.opt .d{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.opt .chk{margin-left:auto;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;flex:none;color:transparent;transition:all .2s}
.opt[aria-checked="true"] .chk{background:linear-gradient(135deg,var(--brand),var(--brand-2));border-color:transparent;color:#fff;transform:scale(1.08)}
.opt.red{border-left:3px solid var(--em)}
.opt.red .tag{display:inline-block;font-size:10.5px;font-weight:800;color:var(--em);background:var(--em-bg);padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:2px}
.stagger>*{opacity:0;animation:rise .45s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0) * 45ms + 120ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
/* deep questions */
.deep-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--brand-2);background:color-mix(in srgb,var(--brand-2) 12%,transparent);border:1px solid color-mix(in srgb,var(--brand-2) 30%,transparent);padding:3px 10px;border-radius:999px;margin-bottom:12px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn .opt{justify-content:center;flex-direction:column;gap:4px;min-height:92px;font-size:17px;text-align:center}
.yn .opt .ico{font-size:24px}
.yn .opt.unsure{grid-column:1/-1;min-height:0;flex-direction:row;padding:11px;font-size:15px;color:var(--muted)}
.yn .opt.yes:hover{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.yn .opt.no:hover{border-color:var(--em);box-shadow:0 0 0 3px var(--em-bg)}
.leaders{margin-top:18px;padding:14px 16px;border-radius:16px;background:var(--surface-2);border:1px dashed var(--line)}
.leaders h3{margin:0 0 10px;font-size:12px;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:8px}
.leaders h3 i{width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 10px var(--brand);animation:breathe 1s ease-in-out infinite}
.lead{display:grid;grid-template-columns:1fr 46px;gap:4px 10px;align-items:center;font-size:13.5px;margin-top:8px}
.lead span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead b{text-align:right;color:var(--brand)}
.lead .track{grid-column:1/-1;height:6px;border-radius:999px;background:color-mix(in srgb,var(--line) 70%,transparent);overflow:hidden}
.lead .track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .8s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px var(--glow)}
/* analysis scanner */
.scan{text-align:center;padding:34px 20px 30px}
.scanner{position:relative;width:150px;height:150px;margin:0 auto 22px}
.scanner i{position:absolute;inset:0;border-radius:50%;border:2px solid transparent}
.scanner i:nth-child(1){border-top-color:var(--brand);border-right-color:var(--brand);animation:spin 1.3s linear infinite;box-shadow:0 0 24px var(--glow)}
.scanner i:nth-child(2){inset:16px;border-bottom-color:var(--brand-2);border-left-color:var(--brand-2);animation:spin 1.9s linear infinite reverse}
.scanner i:nth-child(3){inset:34px;border:1px dashed color-mix(in srgb,var(--brand) 60%,transparent);animation:spin 7s linear infinite}
.scanner b{position:absolute;inset:48px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle,var(--brand-3),transparent 70%);animation:breathe 1.2s ease-in-out infinite}
.scanner::after{content:"";position:absolute;left:8%;right:8%;height:2px;top:50%;background:linear-gradient(90deg,transparent,var(--brand),transparent);box-shadow:0 0 12px var(--brand);animation:scanY 1.6s ease-in-out infinite alternate}
@keyframes scanY{from{transform:translateY(-60px)}to{transform:translateY(60px)}}
.scan h2{margin:0 0 6px;font-size:20px;letter-spacing:-.02em}
.scan-steps{list-style:none;padding:0;margin:16px auto 0;max-width:280px;text-align:left;display:grid;gap:8px;font-size:14px;color:var(--muted)}
.scan-steps li{display:flex;gap:10px;align-items:center;opacity:.35;transition:opacity .3s,color .3s}
.scan-steps li i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:10px;font-style:normal;transition:all .3s}
.scan-steps li.on{opacity:1;color:var(--text)}
.scan-steps li.on i{border-color:var(--brand);border-top-color:transparent;animation:spin .8s linear infinite}
.scan-steps li.ok{opacity:1;color:var(--text)}
.scan-steps li.ok i{background:var(--brand);border-color:var(--brand);color:#fff;animation:none}
/* vitals */
.vitals{display:grid;gap:10px}
.vital{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--surface-2);transition:border-color .2s,box-shadow .2s}
.vital:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-3)}
.vital .vi{font-size:26px;width:36px;text-align:center}
.vital label{flex:1;font-weight:700;font-size:15px}
.vital label small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.vital .in{display:flex;align-items:baseline;gap:4px}
.vital input{width:88px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface-solid);text-align:right;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.vital .u{color:var(--muted);font-size:13px;width:34px}
.vital input::placeholder{font-weight:400;color:var(--muted);opacity:.55;font-size:14px}
.err{color:var(--em);font-size:12.5px;margin:-4px 4px 0}
/* NRS */
.nrs-face{font-size:66px;text-align:center;line-height:1;margin-top:4px;transition:transform .25s}
.nrs-face.pop{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.18)}}
.nrs-val{font-size:15px;font-weight:800;text-align:center;margin-top:8px}
.nrs-val b{font-size:34px;background:linear-gradient(90deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.nrs-lab{text-align:center;color:var(--muted);margin:2px 0 14px;min-height:1.5em}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:999px;background:linear-gradient(90deg,#2dd4bf,#facc15 50%,#f43f5e);outline-offset:6px;box-shadow:0 0 16px var(--glow)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--brand);box-shadow:0 0 0 6px var(--brand-3),0 0 18px var(--glow)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--brand)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}
textarea{width:100%;min-height:130px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2);resize:vertical;line-height:1.6;transition:border-color .2s,box-shadow .2s}
textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-3)}
.kwrow{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--brand-3);color:var(--brand);font-weight:700;border:1px solid color-mix(in srgb,var(--brand) 25%,transparent);animation:rise .3s ease}
.chip.off{background:var(--surface-2);color:var(--muted);font-weight:500;border-color:var(--line)}
/* intro */

    });
    $("btnPrev").addEventListener("click", function () {
      if (state.fuTrail.length) { delete state.answers.followups[state.fuTrail.pop()]; renderDeep(); }
      else { state.view = "wizard"; state.answers.followups = {}; renderStep(); }
    });
    $("btnSkipDeep").addEventListener("click", submit);
    var t = $("qTitle"); if (t) t.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  // ---------------- Modals ----------------
  var lastFocus = null;
  function openModal(id) { lastFocus = document.activeElement; $(id).classList.add("open"); var f = $(id).querySelector("button,a,input"); if (f) f.focus(); }
  function closeModal(id) { $(id).classList.remove("open"); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { ["askModal", "flagModal", "histModal"].some(function (m) { if ($(m).classList.contains("open")) { if (m === "askModal") $("askNo").click(); else closeModal(m); return true; } return false; }); }
  });
  ["flagModal", "histModal"].forEach(function (m) { $(m).addEventListener("click", function (e) { if (e.target === $(m)) closeModal(m); }); });

  function callButtons(flags) {
    var crisis = flags.some(function (f) { return f.code === "sym:suicidal"; });
    return '<div class="call">' + (crisis ? '<a href="tel:109">📞 109 자살예방상담</a>' : "") + '<a href="tel:119">📞 119 응급 신고</a></div>';
  }
  function showFlagModal(flags) {
    var em = flags.some(function (f) { return f.level === "emergency"; });
    $("flagBox").className = "box " + (em ? "em" : "ur");
    $("flagBox").innerHTML = '<h2 id="flagTitle">' + (em ? "🚨 응급일 수 있는 증상이에요" : "⚠ 오늘 진료가 필요한 증상이에요") + '</h2>' +
      '<ul class="flags">' + flags.map(function (f) { return '<li><span class="lvl ' + f.level + '">' + (f.level === "emergency" ? "응급" : "우선") + '</span><b>' + esc(f.title) + '</b>' + esc(f.reason) + '</li>'; }).join("") + '</ul>' +
      '<p class="q-help" style="margin-top:12px">' + (em ? "지금 이 증상이 있다면 바로 119에 연락하세요. 괜찮다면 문진을 이어서 의사에게 보여줄 요약지를 만들 수 있어요."
        : "오늘 안에 병원 진료를 받는 게 좋아요. 문진을 이어서 요약지를 만들어 가세요.") + '</p>' +
      callButtons(flags) +
      '<div class="actions"><button class="btn primary" type="button" id="flagOk">확인했어요, 계속할게요</button></div>';
    $("flagOk").addEventListener("click", function () { closeModal("flagModal"); });
    openModal("flagModal");
  }

  // ---------------- Submit & storage ----------------
  function readLocal() { try { var x = JSON.parse(store.get(LS_HIST) || "[]"); return Array.isArray(x) ? x : []; } catch (e) { return []; } }
  function writeLocal(list) { store.set(LS_HIST, JSON.stringify(list.slice(0, 50))); }
  function saveLocal(rec) { var l = readLocal().filter(function (r) { return r.session_id !== rec.session_id; }); l.unshift(rec); writeLocal(l); }

  function fetchJSON(url, opts, timeoutMs) {
    opts = opts || {};
    var ctl = window.AbortController ? new AbortController() : null;
    if (ctl) opts.signal = ctl.signal;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, timeoutMs || 6000) : null;
    return fetch(url, opts).then(function (r) {
      clearTimeout(timer);
      return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || ("HTTP " + r.status)); e.status = r.status; e.body = j; throw e; } return j; });
    }, function (e) { clearTimeout(timer); throw e; });
  }

  function finalAnswers() {
    var a = JSON.parse(JSON.stringify(state.answers));
    if (!needsFinding(a)) a.finding = null;
    if (!needsPreg(a)) a.pregnancy = null;
    a.text = (a.text || "").slice(0, 1000);
    return a;
  }

  function submit() {
    var a = finalAnswers(), errs = ENGINE.validate(a);
    if (errs.length) { toast("입력값을 확인해 주세요: " + errs.join(", ")); return; }
    var uid = userId(), nfu = Object.keys(a.followups || {}).length;
    var scan = runScan("결과지를 만들고 있어요", (nfu ? "맞춤 질문 " + nfu + "개까지 " : "") + "모든 답변을 모아 가능성을 계산해요.", ["답변 모으기", "질환별 가능성 계산", "진료과 · 검사 정리"], 1300);
    var finish = function (rec, note) { scan.then(function () { if (note) toast(note); showResult(rec); }); };
    var local = function (note) {
      var result = ENGINE.diagnose(a, nowStr());
      var rec = { session_id: "local-" + deviceKey().slice(0, 4) + Date.now().toString(36), ts: Date.now(), user_id: uid, created_at: result.created_at, source: "local", answers: a, result: result };
      saveLocal(rec);
      finish(rec, note);
    };
    if (!state.server) { local(); return; }
    fetchJSON("api/diagnose", { method: "POST", headers: { "Content-Type": "application/json", "X-MediNavi-Key": deviceKey() }, body: JSON.stringify({ user_id: uid, answers: a }) }, 8000)
      .then(function (j) {
        var rec = { session_id: j.session_id, ts: Date.now(), user_id: uid, created_at: j.result.created_at, source: "server", answers: a, result: j.result };
        saveLocal(rec);
        finish(rec);
      })
      .catch(function (e) {
        if (e.status === 422 || e.status === 400) { scan.then(function () { state.view = "wizard"; renderStep(); toast("서버가 입력값을 거부했습니다: " + (e.body && e.body.details ? e.body.details.join(", ") : e.message)); }); return; }
        state.server = false; setStatus();
        local("서버에 연결할 수 없어 이 기기에서 분석하고 저장했습니다.");
      });
  }

  // ---------------- Result ----------------
  function showResult(rec) {
    state.view = "result"; state.lastResult = rec;
    var r = rec.result, s = r.summary, t = r.triage;
    var TI = { emergency: "🚑", urgent: "⚠️", soon: "🏥", routine: "🏠" };
    var flagsHtml = r.red_flags.length ? '<ul class="flags">' + r.red_flags.map(function (f) { return '<li><span class="lvl ' + f.level + '">' + (f.level === "emergency" ? "응급" : "우선") + '</span><b>' + esc(f.title) + '</b>' + esc(f.reason) + '</li>'; }).join("") + '</ul>' : "";
    var vit = []; if (s.vitals.temp !== null) vit.push("🌡️ " + s.vitals.temp + "℃"); if (s.vitals.hr !== null) vit.push("💓 " + s.vitals.hr); if (s.vitals.spo2 !== null) vit.push("🫧 " + s.vitals.spo2 + "%");
    var html = '<article class="sheet fade"><div class="sheet-head"><div><b>📋 진료 결과지</b><small>' + esc(r.created_at) + ' · ' + (rec.source === "server" ? "서버 분석" : "기기 내 분석") + '</small></div><span class="stamp">MEDINAVI</span></div>' +
      '<div class="patient"><span>ID <b>' + esc(rec.user_id) + '</b></span><span><b>' + esc(s.age) + ' · ' + esc(s.sex) + '</b></span><span>불편 부위 <b>' + esc(s.region) + '</b></span>' +
      '<span>통증 <b>' + s.nrs + '/10</b></span>' + (vit.length ? '<span><b>' + esc(vit.join("  ")) + '</b></span>' : "") + '</div><div class="sheet-body">';
    html += '<section class="triage ' + t.level + '" role="alert"><span class="ti" aria-hidden="true">' + TI[t.level] + '</span><div><h2>' + esc(t.title) + '</h2><p>' + esc(t.message) + '</p>' +
      flagsHtml + (t.level === "emergency" ? callButtons(r.red_flags) : "") + '</div></section>';
    var nfu = (s.followups || []).length;
    html += '<h2 class="sec-title">🔎 가능성 높은 질환 <small>후보끼리 비교한 비율</small>' + (nfu ? '<span class="chip">🔬 맞춤 질문 ' + nfu + '개 반영</span>' : "") + '</h2>';
    if (!r.candidates.length) {
      html += '<div class="cand">입력한 내용만으로는 질환을 좁히기 어려워요. 증상이 계속되면 가정의학과·내과 진찰을 받아 보세요.</div>';
    } else {
      html += '<div class="cands stagger">' + r.candidates.map(function (c, i) {
        return '<div class="cand' + (i === 0 ? " first" : "") + '" style="--i:' + i + '"><div class="head"><div class="ring" style="--p:' + (REDUCED ? c.pct : 0) + '" data-p="' + c.pct + '" aria-label="가능성 ' + c.pct + '%"><b class="num">' + (REDUCED ? c.pct : 0) + '%</b></div>' +
          '<h3><span class="rank">' + (i + 1) + '순위</span>' + esc(c.name) + '</h3></div>' +
          '<p>' + esc(c.desc) + '</p>' +
          '<div class="kvl">가 볼 진료과</div><div class="pills"><span class="pill dept">' + esc(c.dept) + '</span></div>' +
          '<div class="kvl">병원에서 할 수 있는 검사</div><div class="pills">' + c.tests.map(function (x) { return '<span class="pill">' + esc(x) + '</span>'; }).join("") + '</div>' +
          '<details><summary>왜 이렇게 봤나요?</summary><ul>' + c.reasons.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join("") + '</ul></details></div>';
      }).join("") + '</div>';
      html += '<p class="disc">%는 후보 질환끼리 비교한 상대적인 가능성이에요. 실제로 그 병에 걸렸을 확률은 아니에요.</p>';
    }
    html += '<h2 class="sec-title">🗒️ 의사에게 보여줄 요약지</h2>' +
      '<pre class="note" id="noteText">' + esc(r.note) + '</pre>' +
      '<div class="actions no-print"><button class="btn" type="button" id="btnCopy">📋 복사하기</button>' + (window.MEDINAVI_STATIC ? "" : '<button class="btn" type="button" id="btnPrint">🖨 인쇄 · PDF</button>') + '</div>' +
      '<p class="disc">' + esc(r.disclaimer) + '</p></div></article>' +
      '<div class="actions no-print"><button class="btn" type="button" id="btnHist2">🗂 기록함</button><button class="btn primary" type="button" id="btnNew">새로 접수하기</button></div>';
    $("app").innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll(".ring[data-p]"), function (ring, i) {
      var to = +ring.getAttribute("data-p"), b = ring.querySelector("b");
      if (REDUCED) return;
      setTimeout(function () {
        var t0 = null;
        (function step(t) {
          if (t0 === null) t0 = t;
          var k = Math.min(1, (t - t0) / 1000), v = Math.round(to * (1 - Math.pow(1 - k, 3)));
          ring.style.setProperty("--p", v); b.textContent = v + "%";
          if (k < 1) requestAnimationFrame(step);
        })(performance.now());
      }, 250 + i * 120);
    });
    $("btnCopy").addEventListener("click", function () { copyText(r.note); });
    if ($("btnPrint")) $("btnPrint").addEventListener("click", function () { Array.prototype.forEach.call(document.querySelectorAll("details"), function (d) { d.open = true; }); window.print(); });
    $("btnNew").addEventListener("click", startWizard);
    $("btnHist2").addEventListener("click", openHistory);
    window.scrollTo(0, 0);
  }

  function copyText(txt) {
    var done = function () { toast("요약지를 복사했어요. 병원에서 보여 주세요."); };
    var fallback = function () {
      var ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { toast("복사에 실패했습니다. 노트를 직접 선택해 복사해 주세요."); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
  }

  // ---------------- History ----------------
  function openHistory() {
    var uid = userId();
    $("histBox").innerHTML = '<h2 id="histTitle">🗂 기록함 <small style="font-size:13px;color:var(--muted);font-weight:500">' + esc(uid) + '</small></h2><div class="empty">불러오는 중…</div>';
    openModal("histModal");
    var locals = readLocal().filter(function (r) { return r.user_id === uid; });
    var p = state.server ? fetchJSON("api/history?user_id=" + encodeURIComponent(uid), { headers: { "X-MediNavi-Key": deviceKey() } }, 6000).then(function (j) { return j.items || []; }, function () { return null; }) : Promise.resolve(null);
    p.then(function (serverItems) {
      var map = {}, items = [];
      locals.forEach(function (r) { map[r.session_id] = { session_id: r.session_id, ts: r.ts || 0, created_at: r.created_at, region: r.answers.region, triage_level: r.result.triage.level, top_name: r.result.candidates[0] ? r.result.candidates[0].name : null, top_pct: r.result.candidates[0] ? r.result.candidates[0].pct : null, local: true, server: r.source === "server" }; });
      (serverItems || []).forEach(function (it) {
        if (map[it.session_id]) { map[it.session_id].server = true; map[it.session_id].ts = Date.parse(it.created_at) || map[it.session_id].ts; }
        else map[it.session_id] = { session_id: it.session_id, ts: Date.parse(it.created_at) || 0, created_at: it.created_at.replace("T", " ").slice(0, 16), region: it.region, triage_level: it.triage_level, top_name: it.top_name, top_pct: it.top_pct, local: false, server: true };
      });
      Object.keys(map).forEach(function (k) { items.push(map[k]); });
      items.sort(function (x, y) { return (y.ts - x.ts) || (x.created_at < y.created_at ? 1 : -1); });
      renderHistory(uid, items, serverItems === null && state.server);
    });
  }
  var LEVEL_KO = { emergency: "응급", urgent: "우선 진료", soon: "외래 예약", routine: "경과 관찰" };
  function renderHistory(uid, items, serverFailed) {
    var html = '<h2 id="histTitle">🗂 기록함 <small style="font-size:13px;color:var(--muted);font-weight:500">' + esc(uid) + '</small></h2>' +
      '<p class="q-help" style="margin:0">이 기기에 저장된 기록이에요. 눌러서 결과지를 다시 볼 수 있어요.</p>' +
      (serverFailed ? '<div class="notice info" style="margin-top:10px">서버 기록을 불러오지 못해 이 기기에 저장된 기록만 표시합니다.</div>' : "");
    if (!items.length) html += '<div class="empty">저장된 기록이 없습니다.</div>';
    else html += '<ul class="hist-list">' + items.map(function (it) {
      return '<li><button class="open" type="button" data-open="' + esc(it.session_id) + '"><b>' + esc(it.top_name || "후보 없음") + (it.top_pct !== null && it.top_pct !== undefined ? " · " + it.top_pct + "%" : "") + '</b>' +
        '<span class="sub"><span class="dot ' + esc(it.triage_level) + '"></span>' + esc(it.created_at) + ' · ' + esc(lab(KB.regions, it.region)) + ' · ' + esc(LEVEL_KO[it.triage_level] || it.triage_level) +
        (it.server ? '<span class="src">서버</span>' : "") + (it.local ? '<span class="src">이 기기</span>' : "") + '</span></button>' +
        '<button class="btn sm danger" type="button" data-del="' + esc(it.session_id) + '" aria-label="이 기록 삭제">삭제</button></li>';
    }).join("") + '</ul>';
    html += '<div class="actions"><button class="btn sm danger" type="button" id="btnWipe">이 기기 기록 모두 삭제</button><button class="btn" type="button" id="histClose">닫기</button></div>';
    $("histBox").innerHTML = html;
    $("histClose").addEventListener("click", function () { closeModal("histModal"); });
    $("btnWipe").addEventListener("click", function () {
      ask("이 브라우저에 저장된 모든 문진 기록을 삭제할까요? (서버 기록은 각 항목의 삭제 버튼으로 지울 수 있습니다)", "모두 삭제").then(function (ok) {
        if (!ok) return; store.del(LS_HIST); toast("이 기기 기록을 삭제했습니다."); openHistory();
      });
    });
    Array.prototype.forEach.call($("histBox").querySelectorAll("[data-open]"), function (b) {
      b.addEventListener("click", function () { restore(b.getAttribute("data-open")); });
    });
    Array.prototype.forEach.call($("histBox").querySelectorAll("[data-del]"), function (b) {
      b.addEventListener("click", function () { removeRecord(b.getAttribute("data-del")); });
    });
  }
  function restore(id) {
    var rec = readLocal().filter(function (r) { return r.session_id === id; })[0];
    if (rec) { closeModal("histModal"); showResult(rec); return; }
    fetchJSON("api/history/" + encodeURIComponent(id), { headers: { "X-MediNavi-Key": deviceKey() } }, 6000).then(function (j) {
      var r = { session_id: j.session_id, ts: Date.now(), user_id: j.user_id, created_at: j.result.created_at, source: "server", answers: j.answers, result: j.result };
      saveLocal(r); closeModal("histModal"); showResult(r);
    }, function () { toast("기록을 불러오지 못했습니다."); });
  }
  function removeRecord(id) {
    ask("이 기록을 삭제할까요? 되돌릴 수 없습니다.", "삭제").then(function (ok) { if (ok) doRemove(id); });
  }
  function doRemove(id) {
    writeLocal(readLocal().filter(function (r) { return r.session_id !== id; }));
    var p = (state.server && /^[0-9a-f]{32}$/.test(id)) ? fetchJSON("api/history/" + id, { method: "DELETE", headers: { "X-MediNavi-Key": deviceKey() } }, 6000).catch(function (e) { if (e.status !== 404) toast("서버 기록 삭제에 실패했습니다."); }) : Promise.resolve();
    p.then(function () { toast("삭제했습니다."); openHistory(); });
  }

  // ---------------- Ripple ----------------
  document.addEventListener("pointerdown", function (e) {
    if (REDUCED) return;
    var b = e.target.closest && e.target.closest(".btn,.opt,.hbtn");
    if (!b || b.disabled) return;
    var r = b.getBoundingClientRect(), d = Math.max(r.width, r.height), sp = document.createElement("span");
    sp.className = "ripple";
    sp.style.width = sp.style.height = d + "px";
    sp.style.left = (e.clientX - r.left - d / 2) + "px";
    sp.style.top = (e.clientY - r.top - d / 2) + "px";
    b.appendChild(sp);
    setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 650);
  });

  // ---------------- Boot ----------------
  function setStatus() {
    var el = $("status");
    el.className = "status" + (state.server ? " on" : "");
    el.textContent = state.server ? "● 서버 저장" : "○ 기기 저장";
  }
  function bootServer() {
    if (location.protocol === "file:" || window.MEDINAVI_STATIC) { state.server = false; setStatus(); return; }
    fetchJSON("api/bootstrap", {}, 2500).then(function (j) { state.server = !!j.ok; setStatus(); }, function () { state.server = false; setStatus(); });
  }
  function fatal(e) {
    var app = $("app");
    if (app) app.innerHTML = '<div class="card"><h2 class="q-title">화면을 불러오지 못했습니다</h2><p class="q-help">새로고침해 주세요. 문제가 계속되면 다른 브라우저로 접속해 주세요.</p><div class="actions"><button class="btn primary" type="button" onclick="location.reload()">새로고침</button></div></div>';
    if (window.console) console.error("[MediNavi] init failed", e);
  }
  function init() {
    try {
      KB = JSON.parse($("medinavi-kb").textContent);
      ENGINE = window.MediNaviEngine.create(KB);
      var uid = store.get(LS_UID);
      $("uid").value = uid && UID_RE.test(uid) ? uid : "guest";
      $("uid").addEventListener("change", function () {
        var v = this.value.trim();
        if (!UID_RE.test(v)) { toast("사용자 ID는 한글·영문·숫자·_- 1~32자입니다."); this.value = userId(); return; }
        store.set(LS_UID, v);
      });
      $("btnHistory").addEventListener("click", openHistory);
      deviceKey();
      bootServer();
      renderIntro();
    } catch (e) { fatal(e); }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
  window.addEventListener("error", function (e) { if (!KB) fatal(e.error || e); });
})();
</script>
</body>
</html>
